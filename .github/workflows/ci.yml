name: Web Build Test

on:
  push:
    branches: [ "yerim", "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Check JavaScript Syntax
      run: |
        node -c study_01.js
        echo "JavaScript 문법 검사 완료"

    - name: Complete Build Check
      run: echo "테스트 성공"
